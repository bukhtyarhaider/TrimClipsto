<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tc-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="tc-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="tc-blade-top" x1="14" y1="12" x2="40" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="tc-blade-bot" x1="20" y1="32" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="tc-play" x1="25" y1="20" x2="42" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="tc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- High-contrast rounded squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tc-bg)" stroke="url(#tc-border)" stroke-width="1.75" />

  <!-- Ambient light blobs -->
  <circle cx="20" cy="18" r="14" fill="#38bdf8" fill-opacity="0.22" />
  <circle cx="44" cy="46" r="14" fill="#6366f1" fill-opacity="0.22" />

  <!-- Upper Trim Blade -->
  <path d="M16 16 C16 14.3 17.3 13 19 13 L28 13 C30.2 13 32.1 14.3 32.9 16.3 L39.5 31 L29 31 L20.5 19 L19 19 C17.9 19 17 19.9 17 21 C17 22.1 17.9 23 19 23 L24 23 L20 31 C17.8 30.5 16 28.5 16 26 Z" fill="url(#tc-blade-top)" />

  <!-- Lower Trim Blade -->
  <path d="M48 48 C48 49.7 46.7 51 45 51 L36 51 C33.8 51 31.9 49.7 31.1 47.7 L24.5 33 L35 33 L43.5 45 L45 45 C46.1 45 47 44.1 47 43 C47 41.9 46.1 41 45 41 L40 41 L44 33 C46.2 33.5 48 35.5 48 38 Z" fill="url(#tc-blade-bot)" />

  <!-- Center Sliced Playhead (Upper Triangle) -->
  <path d="M25 21 L39 29 C40.2 29.7 40.2 30.5 39.2 31 L25 31 Z" fill="url(#tc-play)" filter="url(#tc-glow)" />

  <!-- Center Sliced Playhead (Lower Triangle) -->
  <path d="M25 33 L39.2 33 C40.2 33.5 40.2 34.3 39 35 L25 43 Z" fill="url(#tc-play)" />

  <!-- Precision Razor Slit Accent Line & Dot -->
  <line x1="21" y1="32" x2="43" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="44" cy="32" r="1.5" fill="#e0f2fe" />
</svg>
